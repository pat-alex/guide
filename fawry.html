<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الدفع - خدمات المعلمين</title>
  <!-- استخدام Tailwind CSS لتصميم عصري ومريح للعين -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

  <!-- حاوية التطبيق الرئيسية -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 sm:p-8 relative overflow-hidden">
    
    <!-- رأس الصفحة -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">بوابة خدمات المعلمين</h1>
      <p class="text-gray-500 mt-2 text-sm">احصل على كود الدفع (فوري) للخدمات والدورات</p>
    </div>

    <!-- مؤشر التحميل -->
    <div id="loader" class="hidden absolute inset-0 bg-white bg-opacity-90 z-10 flex flex-col items-center justify-center">
      <div class="loader"></div>
      <p class="mt-4 text-blue-600 font-medium" id="loader-text">جاري التحميل...</p>
    </div>

    <!-- شاشة تسجيل الدخول (الاستعلام بالرقم القومي) -->
    <div id="login-section" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">أدخل الرقم القومي (14 رقم بالإنجليزية)</label>
        <input type="text" id="login-nid" pattern="[0-9]{14}" maxlength="14" placeholder="مثال: 29001011234567" 
               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-left" dir="ltr" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>
      <button onclick="checkUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        دخول / استعلام
      </button>
    </div>

    <!-- شاشة عرض حالة الطلب وكود فوري -->
    <div id="status-section" class="hidden space-y-6">
      <div class="bg-gray-50 rounded-lg p-4 border border-gray-100">
        <p class="text-sm text-gray-500">أهلاً بك،</p>
        <p class="text-lg font-bold text-gray-800" id="display-name"></p>
      </div>

      <div id="status-message-container" class="p-4 rounded-lg text-center font-medium"></div>

      <!-- مربع كود فوري (يظهر فقط إذا كان متاحاً وصالحاً) -->
      <div id="fawry-box" class="hidden bg-blue-50 border-2 border-blue-200 rounded-xl p-6 text-center">
        <p class="text-blue-800 font-medium mb-2">كود الدفع الخاص بك:</p>
        <p class="text-4xl font-bold text-blue-700 tracking-widest font-mono" id="display-fawry-code"></p>
        <p class="text-xs text-red-500 mt-3 font-medium">* تنبيه: هذا الكود صالح لمدة 24 ساعة فقط من وقت إصداره.</p>
      </div>

      <button onclick="showRequestForm()" class="w-full bg-white border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-bold py-3 px-4 rounded-lg transition duration-200 mt-4">
        طلب خدمة جديدة / كود جديد
      </button>
      <button onclick="resetApp()" class="w-full text-gray-500 hover:text-gray-700 text-sm py-2">تسجيل خروج</button>
    </div>

    <!-- شاشة نموذج تقديم طلب جديد -->
    <div id="form-section" class="hidden">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">تقديم طلب جديد</h2>
      <form id="request-form" class="space-y-4" onsubmit="submitForm(event)">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">الرقم القومي</label>
          <input type="text" id="form-nid" readonly class="w-full px-4 py-2 rounded-lg border border-gray-200 bg-gray-100 text-gray-600 text-left cursor-not-allowed" dir="ltr">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">الاسم الرباعي</label>
          <input type="text" id="form-name" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">رقم الموبايل</label>
          <input type="tel" id="form-mobile" required pattern="[0-9]{11}" maxlength="11" placeholder="01xxxxxxxxx" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="form-email" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">نوع الخدمة</label>
          <select id="form-service" required onchange="toggleCertCount()" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="" disabled selected>اختر الخدمة...</option>
            <option value="دفع رسوم دورة">دفع رسوم دورة</option>
            <option value="طلب شهادة إضافية">طلب شهادة إضافية</option>
          </select>
        </div>

        <div id="cert-count-container" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">عدد الشهادات المطلوبة</label>
          <input type="number" id="form-cert-count" min="1" max="10" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="flex gap-3 pt-4">
          <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
            تأكيد وإرسال الطلب
          </button>
          <button type="button" onclick="cancelForm()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-lg transition duration-200">
            إلغاء
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- أكواد الجافاسكريبت للتحكم بالواجهة -->
  <script>
    // هام جداً: ضع هنا رابط الـ Web App الخاص بك الذي سينتجه جوجل سكريبت
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmqavz-sh98D_KjITYRW9FHpXARaVkWjS6qOGZFZhNTzTXuMIElnCW_jP8GFY49JA/exec';

    // تخزين البيانات محلياً أثناء الجلسة
    let currentUserData = {};
    let currentNID = "";

    function showLoader(text = "جاري التحميل...") {
      document.getElementById('loader-text').innerText = text;
      document.getElementById('loader').classList.remove('hidden');
    }

    function hideLoader() {
      document.getElementById('loader').classList.add('hidden');
    }

    function switchSection(sectionId) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('status-section').classList.add('hidden');
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById(sectionId).classList.remove('hidden');
    }

    async function checkUser() {
      const nid = document.getElementById('login-nid').value;
      if (nid.length !== 14) {
        alert("يرجى إدخال الرقم القومي المكون من 14 رقم بشكل صحيح.");
        return;
      }

      currentNID = nid;
      showLoader("جاري البحث عن بياناتك...");

      try {
        // إرسال الطلب إلى جوجل سكريبت
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getUserData', nationalId: nid })
        });
        const data = await response.json();
        
        hideLoader();
        if (data.exists) {
          currentUserData = data;
          showStatusScreen();
        } else {
          // مستخدم جديد
          showRequestForm(true);
        }
      } catch (error) {
        hideLoader();
        alert("حدث خطأ في الاتصال. تأكد من وضع رابط الـ Web App الصحيح.");
      }
    }

    function showStatusScreen() {
      document.getElementById('display-name').innerText = currentUserData.name;
      const statusBox = document.getElementById('status-message-container');
      const fawryBox = document.getElementById('fawry-box');
      
      // تهيئة صندوق الرسائل بناءً على توفر الكود وصلاحيته
      if (currentUserData.isValidCode) {
        statusBox.className = "p-4 rounded-lg text-center font-medium bg-green-100 text-green-800";
        statusBox.innerText = currentUserData.statusMessage;
        document.getElementById('display-fawry-code').innerText = currentUserData.fawryCode;
        fawryBox.classList.remove('hidden');
      } else {
        statusBox.className = "p-4 rounded-lg text-center font-medium bg-yellow-100 text-yellow-800";
        statusBox.innerText = currentUserData.statusMessage;
        fawryBox.classList.add('hidden');
      }
      
      switchSection('status-section');
    }

    function showRequestForm(isNewUser = false) {
      document.getElementById('form-nid').value = currentNID;
      
      // تعبئة البيانات السابقة تلقائياً لتسهيل الأمر على المعلم
      if (!isNewUser && currentUserData.name) {
        document.getElementById('form-name').value = currentUserData.name;
        document.getElementById('form-mobile').value = currentUserData.mobile;
        document.getElementById('form-email').value = currentUserData.email;
      }
      
      // إعادة تعيين الخيارات
      document.getElementById('form-service').value = "";
      document.getElementById('form-cert-count').value = "";
      toggleCertCount();
      
      switchSection('form-section');
    }

    function toggleCertCount() {
      const service = document.getElementById('form-service').value;
      const countContainer = document.getElementById('cert-count-container');
      const countInput = document.getElementById('form-cert-count');
      
      if (service === "طلب شهادة إضافية") {
        countContainer.classList.remove('hidden');
        countInput.required = true;
      } else {
        countContainer.classList.add('hidden');
        countInput.required = false;
        countInput.value = "";
      }
    }

    async function submitForm(event) {
      event.preventDefault();
      
      const formData = {
        nationalId: currentNID,
        name: document.getElementById('form-name').value,
        mobile: document.getElementById('form-mobile').value,
        email: document.getElementById('form-email').value,
        serviceType: document.getElementById('form-service').value,
        certCount: document.getElementById('form-cert-count').value || "-"
      };

      showLoader("جاري إرسال الطلب...");

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitRequest', formData: formData })
        });
        const data = await response.json();
        
        hideLoader();
        if (data.success) {
          // تحديث البيانات المحلية لعرض شاشة الحالة الجديدة
          currentUserData = {
            name: formData.name,
            isValidCode: false,
            statusMessage: "تم إرسال طلبك بنجاح وهو الآن قيد المراجعة لإصدار الكود."
          };
          showStatusScreen();
        } else {
          alert("حدث خطأ أثناء الإرسال: " + data.error);
        }
      } catch (error) {
        hideLoader();
        alert("حدث خطأ في الاتصال بالسيرفر.");
      }
    }

    function cancelForm() {
      if (currentUserData.name) {
        showStatusScreen(); // العودة للحالة إذا كان له بيانات سابقة
      } else {
        resetApp(); // العودة للشاشة الرئيسية إذا كان جديداً
      }
    }

    function resetApp() {
      currentNID = "";
      currentUserData = {};
      document.getElementById('login-nid').value = "";
      switchSection('login-section');
    }
  </script>
</body>
</html>
